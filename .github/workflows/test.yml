name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q bioaegis

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and verify trust anchor packaging
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              if not any(name.endswith("bioaegis/trusted_update_key.pem") for name in names):
                  raise SystemExit("trusted_update_key.pem is missing from the wheel")
          PY

      - name: CLI smoke tests
        run: |
          bioaegis --version
          bioaegis redteam
          bioaegis scan tests
          bioaegis audit tests
          bioaegis monitor tests --once
