[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioaegis"
version = "0.7.0"
description = "Biologically inspired defensive security research platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "TVcraft01" }]
keywords = ["cybersecurity", "malware-analysis", "endpoint-security", "defensive-security", "artificial-immune-system", "security-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.optional-dependencies]
desktop = ["pywebview>=6,<7"]
desktop-qt = ["pywebview[pyside6]>=6,<7"]
updates = ["cryptography>=43,<50"]

[project.scripts]
bioaegis = "bioaegis.__main__:main"
bioaegis-app = "bioaegis.app:launch"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bioaegis*"]

[tool.setuptools.package-data]
bioaegis = [
  "dashboard_static/*.html",
  "dashboard_static/*.css",
  "dashboard_static/*.js",
  "trusted_update_key.pem",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
